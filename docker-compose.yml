services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mercado
      POSTGRES_USER: mercado
      POSTGRES_PASSWORD: mercado
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercado"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/mercado
      DB_USER: mercado
      DB_PASSWORD: mercado
      JWT_SECRET: troque-esta-chave-por-uma-com-pelo-menos-32-caracteres
    ports: ["8080:8080"]
volumes:
  pgdata:
